# Yubble 个人主页 · 独立部署编排
#
# 与零食店 Agent（snack-store-agent）完全独立的第二个 compose：
#   - 各自 up/down/升级，互不知晓对方存在
#   - 端口只绑 127.0.0.1:8001——外部流量必须经过 Agent 的 nginx（总入口）
#
# 关键设计：整个仓库目录挂载进 /app
#   发布 = 容器内写 site/notes/*.md + git commit → 全部落回宿主机仓库。
#   容器重建不丢笔记；宿主机 git pull 即更新代码（restart 容器生效）。
#
# 启动：docker compose up -d --build
# 验证：curl http://127.0.0.1:8001/notes/index.json
services:
  web:
    build: .
    container_name: yubble-homepage
    restart: unless-stopped
    env_file: .env
    environment:
      # python print 默认块缓冲：audit/proofread 日志憋在缓冲区，docker logs
      # 看不到实时输出，排障时被迫 restart 刷日志（2026-11-14 实测踩坑）
      PYTHONUNBUFFERED: "1"
      # 容器内 git push（NOTES_GIT_PUSH=true 时）走宿主机生成的 GitHub 部署密钥
      GIT_SSH_COMMAND: ssh -i /root/.ssh/github_yubble_notes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    ports:
      - "127.0.0.1:8001:8000"   # 只对本机回环暴露（宿主调试用），公网流量走 nginx 内网直连
    volumes:
      - .:/app                  # 整仓库挂载：笔记落盘 + git 提交都在宿主机仓库里
      # 部署密钥只读挂入（路径可用 .env 的 NOTES_SSH_KEY_HOST 覆盖）：
      #   服务器：默认 /root/.ssh/github_yubble_notes（原生部署密钥，600）
      #   本地 Mac：.env 设 NOTES_SSH_KEY_HOST=${HOME}/.ssh/github_rsa——
      #   本地 VM 无部署密钥，缺文件时 Docker 自动建空目录，ssh 把目录当
      #   私钥检查直接报 UNPROTECTED PRIVATE KEY FILE（2026-11-14 实测）；
      #   OrbStack 对 Mac 文件的权限透传良好（600 进容器仍是 600，实测）。
      #   remote 已统一走 ssh.github.com:443（Mac 的 22 端口被代理掐）。
      - ${NOTES_SSH_KEY_HOST:-/root/.ssh/github_yubble_notes}:/root/.ssh/github_yubble_notes:ro
    networks:
      - default
      - agent-nginx             # 挂进 Agent 的 compose 网络：snack-nginx 用容器名直连，无需暴露端口

# 外部网络：由 /opt/snack-agent 的 compose 创建（snack-agent_default）
networks:
  agent-nginx:
    external: true
    name: snack-agent_default
